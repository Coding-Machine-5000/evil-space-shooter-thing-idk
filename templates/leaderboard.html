<!DOCTYPE html>
<html>
    <head>
        <title>The End Space Shooter</title>
    </head>
    <style>
        table, th, td {
          border:1px solid black;
        }
        </style>
    <body>
        <h1>Leaderboard for T.E.S.S.</h1>
        <table style="width:100%">
            <tr>
              <th>Player</th>
              <th>Highscore</th>
            </tr>
            {%for player in data%}
               <tr>
                 <td>{{player[0]}}</td>
                 <td>{{player[1]}}</td>
                </tr>
            {%endfor%}
          </table>          
    </body>
</html>
